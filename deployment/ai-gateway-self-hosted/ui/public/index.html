<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Gateway Demo</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(48px, 10vh, 104px) 0 48px;
    }
    .eyebrow {
      color: var(--cp-accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .intro {
      max-width: 590px;
      margin: 0 0 32px;
      color: var(--cp-text-muted);
      font-size: 18px;
      line-height: 1.5;
    }
    .identity {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      color: var(--cp-text-muted);
      font-size: 14px;
    }
    .identity strong { color: var(--cp-text); }
    .identity a { color: var(--cp-link); font-weight: 650; text-decoration: none; }
    .identity a:hover { text-decoration: underline; }
    .panel {
      padding: 24px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    textarea {
      display: block;
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
      padding: 14px;
      background: var(--cp-bg-elevated);
      color: var(--cp-text);
      font: inherit;
      line-height: 1.45;
    }
    textarea:focus { outline: 3px solid var(--cp-highlight); border-color: var(--cp-accent); }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 0.625rem;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--cp-accent-hover); }
    button:disabled { cursor: wait; opacity: 0.68; }
    .result {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--cp-border);
    }
    .result.visible { display: block; }
    .status { margin: 0 0 8px; color: var(--cp-text-muted); font-size: 13px; font-weight: 700; }
    .answer { margin: 0; white-space: pre-wrap; line-height: 1.6; }
    .answer.error { color: var(--cp-danger); }
    footer { margin-top: 16px; color: var(--cp-text-soft); font-size: 13px; text-align: center; }
    @media (max-width: 520px) {
      main { width: min(100% - 24px, 720px); padding-top: 36px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Self-hosted gateway</div>
    <h1>Ask the model</h1>
    <p class="intro">Send a prompt through the Azure-hosted APIM gateway and see the model response.</p>
    <div class="identity">
      <span><strong id="user-name">Signed in</strong> · <span id="user-tier">Loading policy tier</span></span>
      <a href="/.auth/logout?post_logout_redirect_uri=/">Sign out</a>
    </div>
    <section class="panel">
      <form id="demo-form">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" maxlength="1000">Share one practical benefit of an AI gateway in one sentence.</textarea>
        <button id="run-button" type="submit">Run demo</button>
      </form>
      <div id="result" class="result" aria-live="polite">
        <p id="status" class="status"></p>
        <p id="answer" class="answer"></p>
      </div>
    </section>
    <footer>GPT-4.1-mini via APIM self-hosted gateway</footer>
  </main>
  <script>
    const form = document.getElementById("demo-form");
    const button = document.getElementById("run-button");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");
    const userName = document.getElementById("user-name");
    const userTier = document.getElementById("user-tier");

    fetch("/api/me")
      .then((response) => response.ok ? response.json() : Promise.reject(new Error("Identity unavailable")))
      .then((identity) => {
        userName.textContent = identity.name || "Signed in";
        userTier.textContent = `${identity.tier} policy`;
      })
      .catch(() => {
        userTier.textContent = "Policy tier unavailable";
      });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Running...";
      result.classList.add("visible");
      status.textContent = "Calling the gateway";
      answer.className = "answer";
      answer.textContent = "";
      try {
        const conversationId = sessionStorage.getItem("conversationId") || crypto.randomUUID();
        sessionStorage.setItem("conversationId", conversationId);
        const response = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: document.getElementById("prompt").value, conversationId }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Request failed.");
        status.textContent = `Completed with ${payload.model}`;
        answer.textContent = payload.text;
      } catch (error) {
        status.textContent = "Request failed";
        answer.className = "answer error";
        answer.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Run demo";
      }
    });
  </script>
</body>
</html>
